<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="khattBgGradient" x1="10" y1="10" x2="90" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0B6E6A" />
      <stop offset="45%" stopColor="#0D9488" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>

    <linearGradient id="goldSparkle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#FDE047" />
      <stop offset="60%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>

    <linearGradient id="bellyGradient" x1="50" y1="55" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="rgba(255, 255, 255, 0.28)" />
      <stop offset="100%" stopColor="rgba(255, 255, 255, 0.08)" />
    </linearGradient>

    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#E2E8F0" />
    </radialGradient>
  </defs>

  <!-- Squircle Badge Background -->
  <rect
    x="4"
    y="4"
    width="92"
    height="92"
    rx="26"
    fill="url(#khattBgGradient)"
  />

  <!-- Subtle Top Inner Highlight -->
  <path
    d="M10 26C10 17.1634 17.1634 10 26 10H74C82.8366 10 90 17.1634 90 26V34C90 34 76 28 50 28C24 28 10 34 10 34V26Z"
    fill="white"
    fillOpacity="0.16"
  />

  <!-- Delicate Border -->
  <rect
    x="4"
    y="4"
    width="92"
    height="92"
    rx="26"
    stroke="white"
    strokeOpacity="0.22"
    strokeWidth="1.5"
  />

  <!-- Calligraphic 'خ' Belly Curve / Owl Body -->
  <path
    d="M26 44C32 44 40 40 46 36C56 29 70 33 76 43C82 53 79 67 71 75C62 84 46 86 34 81C28 78 24 73 23 68C22 64 25 61 29 61C32 61 34 63 36 66C41 71 52 74 61 68C68 63 69 54 64 47C60 41 51 40 43 43C37 45 30 46 25 45C22 44 21 41 23 39C24 38 25 38 26 38"
    fill="white"
    fillOpacity="0.94"
    stroke="white"
    strokeWidth="1.2"
    strokeLinecap="round"
  />

  <!-- Cheerful Mascot Owl Face & Eyes -->
  <!-- Left Big Friendly Owl Eye -->
  <g>
    <circle cx="41" cy="51" r="10" fill="url(#eyeGlow)" />
    <circle cx="43" cy="51" r="5.5" fill="#0F172A" />
    <circle cx="45" cy="49" r="2.2" fill="#FFFFFF" />
    <circle cx="41.5" cy="53" r="1" fill="#FFFFFF" />
  </g>

  <!-- Right Playful Winking / Sparkling Eye -->
  <g>
    <!-- Cute Playful Wink Arch -->
    <path
      d="M57 53C59 47 67 47 69 53"
      stroke="#FFFFFF"
      strokeWidth="3.5"
      strokeLinecap="round"
    />
    <!-- Little Cheek Blush -->
    <circle cx="68" cy="59" r="3" fill="#F43F5E" fillOpacity="0.45" />
    <circle cx="34" cy="59" r="3" fill="#F43F5E" fillOpacity="0.45" />
  </g>

  <!-- Cute Little Golden Pen-Nib / Owl Beak -->
  <path
    d="M48 57C48 57 51 64 51.5 64.5C52 64.5 55 57 55 57C53 58.5 50 58.5 48 57Z"
    fill="url(#goldSparkle)"
    stroke="#B45309"
    strokeWidth="0.8"
  />

  <!-- Floating Glowing Golden AI Star (The 'نقطة الخاء' Sparkle) -->
  <g>
    <!-- Soft Glow -->
    <circle cx="66" cy="22" r="9" fill="#FDE047" fillOpacity="0.3" />
    <!-- Four-Pointed Star -->
    <path
      d="M66 12C66.8 17.5 70.5 21.2 76 22C70.5 22.8 66.8 26.5 66 32C65.2 26.5 61.5 22.8 56 22C61.5 21.2 65.2 17.5 66 12Z"
      fill="url(#goldSparkle)"
    />
    <!-- Mini Center Sparkle -->
    <circle cx="66" cy="22" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Tiny playful sparkle on the bottom left -->
  <path
    d="M17 71C17.5 73.5 19 75 21.5 75.5C19 76 17.5 77.5 17 80C16.5 77.5 15 76 12.5 75.5C15 75 16.5 73.5 17 71Z"
    fill="#FDE047"
    fillOpacity="0.85"
  />
</svg>